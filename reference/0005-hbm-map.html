      <h1>HBM 双层结构</h1>
      <p class="lede">先看 HBM 内部，再看整个 GPU-HBM 封装。</p>
    </header>
    <section class="section">
      <div class="reference-grid">
        <article class="reference-card"><h2>内部：3D</h2><ul><li>多层 DRAM dies 垂直堆叠</li><li>TSV 穿过硅片提供垂直连接</li><li>提升容量密度并形成超宽接口</li></ul></article>
        <article class="reference-card"><h2>整体：2.5D</h2><ul><li>GPU 与 HBM stacks 横向并排</li><li>硅/RDL 中介层提供密集布线</li><li>缩短距离，提高带宽并降低通信能耗</li></ul></article>
      </div>
    </section>
    <section class="section">
      <div class="callout"><p><strong>一句话：</strong>HBM 自己是 3D 堆叠；GPU 与多组 HBM 在中介层上组成的封装通常是 2.5D。</p></div>
