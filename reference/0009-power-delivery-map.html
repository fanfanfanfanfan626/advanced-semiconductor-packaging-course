    <header class="hero">
      <p class="eyebrow">Reference 0009 · Print-friendly</p>
      <h1>供电网络三条主线</h1>
      <p class="lede">同功率低电压意味着大电流；大电流要求短、宽、低阻抗的路径。</p>
    </header>
    <section class="section">
      <div class="reference-grid">
        <article class="reference-card"><h2>电流</h2><ul><li>功率 = 电压 × 电流</li><li>同功率下，电压越低电流越大</li><li>不要遗漏“同功率”条件</li></ul></article>
        <article class="reference-card"><h2>压降</h2><ul><li>路径电阻造成 IR drop</li><li>快速电流变化造成瞬态 droop</li><li>影响频率、稳定性与可靠性</li></ul></article>
        <article class="reference-card"><h2>去耦电容</h2><ul><li>靠近负载的临时能量缓冲</li><li>快速补充瞬态电流</li><li>随后由供电网络重新充电</li></ul></article>
      </div>
    </section>
    <section class="section">
      <div class="callout"><p><strong>一句话：</strong>供电路径要短、宽、低阻抗，电容要靠近负载。</p></div>
