<body>
  <main class="lesson-shell">
    <header class="hero">
      <p class="eyebrow">Reference 0004 · Print-friendly</p>
      <h1>带宽与互连能耗</h1>
      <p class="lede">更密提供更多通道；更短降低通信负载。先分清两条因果链。</p>
    </header>

    <section class="section">
      <div class="reference-grid">
        <article class="reference-card">
          <h2>带宽</h2>
          <span class="equation">B ≈ N × R</span>
          <ul><li>N：通道数</li><li>R：单通道速率</li><li>有效带宽还要乘协议效率</li></ul>
        </article>
        <article class="reference-card">
          <h2>能耗</h2>
          <span class="equation">E ∝ C × V²</span>
          <ul><li>C：等效负载电容</li><li>V：信号电压尺度</li><li>相似条件下，距离缩短通常使 C 降低</li></ul>
        </article>
      </div>
    </section>

    <section class="section">
      <div class="callout"><p><strong>读厂商指标：</strong>“带宽提升”要拆成通道数、单通道速率、协议效率；“能效提升”要检查每比特能耗、距离、封装类型、工作负载和测试条件是否可比。</p></div>
