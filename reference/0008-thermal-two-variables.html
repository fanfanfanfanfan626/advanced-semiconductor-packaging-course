      <p class="eyebrow">Reference 0008 · Print-friendly</p>
      <h1>热问题的两个变量</h1>
      <p class="lede">先看热量多集中，再看热量多难逃出去。</p>
    </header>
    <section class="section">
      <div class="reference-grid">
        <article class="reference-card"><h2>功率密度</h2><ul><li>功率 ÷ 面积</li><li>同样功耗，面积越小越集中</li><li>关注热点，不只看封装总功耗</li></ul></article>
        <article class="reference-card"><h2>热阻</h2><ul><li>表示热量通过路径的困难程度</li><li>材料、厚度和界面共同决定</li><li>热阻越大，相同发热下温升越高</li></ul></article>
        <article class="reference-card"><h2>先进封装张力</h2><ul><li>电路径缩短，有利于带宽与能效</li><li>热源靠近，可能形成热点耦合</li><li>3D 堆叠可能增加垂直热阻</li></ul></article>
      </div>
    </section>
    <section class="section">
      <div class="callout"><p><strong>一句话：</strong>热量越集中、出去越困难，温度越容易升高。</p></div>
