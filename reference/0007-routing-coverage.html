      <h1>高速线路铺在哪里</h1>
      <p class="lede">三条 2.5D 路线，用“材料 + 覆盖范围”区分。</p>
    </header>
    <section class="section">
      <div class="reference-grid">
        <article class="reference-card"><h2>整片硅中介层</h2><ul><li>大片硅覆盖多颗 die 下方</li><li>大范围高密度布线</li><li>关注面积、制造、良率与翘曲</li></ul></article>
        <article class="reference-card"><h2>RDL 中介层</h2><ul><li>聚合物介质 + 铜重布线</li><li>相对柔性、可扩展</li><li>密度和成本取决于具体工艺</li></ul></article>
        <article class="reference-card"><h2>局部硅桥</h2><ul><li>小块硅位于 die 相邻边缘</li><li>只在关键区域铺最密线路</li><li>关注高端基板、嵌桥与对准</li></ul></article>
      </div>

      <div class="callout"><p><strong>一句话：</strong>先问高密度线路要覆盖“整片”还是“局部”，再讨论哪种技术更合适。</p></div>
